<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kerala Tourism Gallery</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f8f5;
}

header{
    background:#00695c;
    color:white;
    text-align:center;
    padding:35px 15px;
}

nav{
    background:#004d40;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:8px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 15px;
}

h2{
    text-align:center;
    color:#00695c;
    margin-bottom:25px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px #0002;
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.card h3{
    text-align:center;
    color:#00695c;
    padding:12px;
}

footer{
    margin-top:30px;
    background:#004d40;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:700px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:450px){
    .gallery{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<h1>🌴 Kerala Tourism</h1>
<p>God's Own Country</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="packages.html">Packages</a>
<a href="gallery.html">Gallery</a>
<a href="index.html#contact">Contact</a>
</nav>

<div class="container">

<h2>📸 Kerala Tourism Gallery</h2>

<div class="gallery">

<div class="card">
<img src="munnar.jpg" alt="Munnar">
<h3>🏔️ Munnar</h3>
</div>

<div class="card">
<img src="kovalam.jpg" alt="Kovalam">
<h3>🏖️ Kovalam</h3>
</div>

<div class="card">
<img src="Alappy.jpg" alt="Alappuzha">
<h3>🚤 Alappuzha</h3>
</div>

<div class="card">
<img src="beach jpj.jpeg" alt="Kerala Beach">
<h3>🌊 Kerala Beach</h3>
</div>

<div class="card">
<img src="backwaters jpj.jpeg" alt="Backwaters">
<h3>🚤 Backwaters</h3>
</div>

<div class="card">
<img src="ayurveda. jpj.jpeg" alt="Kerala Ayurveda">
<h3>🌿 Ayurveda</h3>
</div>

<div class="card">
<img src="dheep jpj.jpeg" alt="Kerala">
<h3>🌴 Kerala</h3>
</div>

</div>
</div>

<footer>
© 2026 Kerala Tourism | God's Own Country
</footer>

</body>
    </html>
